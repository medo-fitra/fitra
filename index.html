<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>تحديث فطرة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;font-family:Arial,Tahoma,sans-serif;text-align:center}main{display:grid;gap:14px;justify-items:center;padding:16px}a{display:inline-flex;align-items:center;justify-content:center;min-width:180px;min-height:60px;padding:14px 40px;border:1px solid #222;border-radius:10px;background:#fff;color:#111;font-size:26px;line-height:1.2;text-decoration:none}a:hover{background:#f5f5f5}a:focus-visible{outline:3px solid #367358;outline-offset:5px}p{margin:0;font-size:18px;color:#444}
</style>
</head>
<body>
<main>
<a id="dl" href="https://github.com/medo-fitra/fitra/releases/download/v1.2/Fitra-1.2.apk" download="fitra-1.2.apk" aria-label="تحديث فطرة، تحميل ملف أندرويد">تحديث</a>
<p id="ver">الإصدار 0.27</p>
</main>
<script>
fetch("https://api.github.com/repos/medo-fitra/fitra/releases/latest",{cache:"no-store"}).then(function(r){return r.json()}).then(function(r){
var v=(r.tag_name||"").replace(/^v/,"");
var assets=r.assets||[];
for(var i=0;i<assets.length;i++){if(/\.apk$/.test(assets[i].name)){var a=document.getElementById("dl");a.href=assets[i].browser_download_url;a.setAttribute("download","fitra-"+v+".apk");break;}}
if(v){document.getElementById("ver").textContent="الإصدار "+v;}
}).catch(function(){});
</script>
</body>
</html>
